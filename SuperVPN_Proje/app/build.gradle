plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.abacicelal.supervpn_project'
    compileSdk 35

    defaultConfig {
        applicationId "com.abacicelal.supervpn_project"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Version catalog’tan gelenler (bunlar zaten libs. ile tanımlı)
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.fragment

    // Liste ekranları için
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Retrofit & OkHttp (API için)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'

    // ✅ ICS-OpenVPN (JitPack üzerinden resmi dependency)
    // JitPack sayfasındaki önerilen sürüm:
    // https://jitpack.io/#schwabe/ics-openvpn
    implementation 'com.github.schwabe:ics-openvpn:v0.6.73-production'

    // Test kütüphaneleri
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
