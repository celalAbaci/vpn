plugins {
    alias(libs.plugins.android.application)
}

// local.properties'den imzalama bilgilerini oku
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.abacicelal.supervpn_project'
    compileSdk 35

    defaultConfig {
        applicationId "com.abacicelal.supervpn_project"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile     file(localProps['KEYSTORE_PATH'] ?: 'dataguardvpn-release.jks')
            storePassword localProps['KEYSTORE_PASSWORD'] ?: ''
            keyAlias      localProps['KEY_ALIAS']         ?: 'dataguardvpn'
            keyPassword   localProps['KEY_PASSWORD']      ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_HOST", '"api.dataguardvpn.com"'
            buildConfigField "boolean", "ENABLE_SECURITY_CHECKS", "true"
            ndk {
                // Gerçek cihazlar sadece ARM — x86/x86_64 emülatör içindir, release'den çıkar
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
        debug {
            // Debug'da x86_64 de dahil (emülatör için)
            buildConfigField "String", "API_HOST", '"api.dataguardvpn.com"'
            buildConfigField "boolean", "ENABLE_SECURITY_CHECKS", "false"
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true  // extractNativeLibs=true equivalent — .so files extracted to disk
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.fragment

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'

    // Güvenlik: Şifreli SharedPreferences (token ve device ID koruması)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Güvenlik: Root tespiti
    implementation 'com.scottyab:rootbeer-lib:0.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
