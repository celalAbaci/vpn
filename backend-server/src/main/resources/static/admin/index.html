<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VPN Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 20px; margin: 10px; display: inline-block; width: 200px; text-align: center; }
        .stat-value { font-size: 2em; font-weight: bold; }
    </style>
</head>
<body>
    <h1>VPN Admin Dashboard</h1>
    <div id="stats">
        <div class="card">
            <div>Total Users</div>
            <div id="totalUsers" class="stat-value">-</div>
        </div>
        <div class="card">
            <div>Total Devices</div>
            <div id="totalDevices" class="stat-value">-</div>
        </div>
        <div class="card">
            <div>Active Connections</div>
            <div id="activeConnections" class="stat-value">-</div>
        </div>
    </div>

    <script>
        // Fetch stats (Mocked for now as we need Auth Token)
        // In real scenario, this would redirect to login or attach Bearer token.
        async function fetchStats() {
            try {
                // This call will fail without token. This is just the HTML structure as requested.
                // The prompt asked for "Admin paneli için temel HTML/JS yapısını adım adım oluştur".
                // Integration with JWT would require a login page.
                const response = await fetch('/api/v1/admin/stats', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('totalUsers').innerText = data.totalUsers;
                    document.getElementById('totalDevices').innerText = data.totalDevices;
                    document.getElementById('activeConnections').innerText = data.activeConnections;
                } else {
                    console.error('Failed to fetch stats');
                }
            } catch (e) {
                console.error(e);
            }
        }

        // fetchStats(); // Disabled auto-fetch to avoid console errors in static view
    </script>
</body>
</html>
