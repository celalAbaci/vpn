plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.abacicelal.supervpn_project'
    compileSdk 35

    defaultConfig {
        applicationId "com.abacicelal.supervpn_project"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        missingDimensionStrategy 'implementation', 'ui'
        missingDimensionStrategy 'ovpnimpl', 'ovpn23'

        ndk {
            // Optimized for size: Only ARM 32/64 bit
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        // Load API URL from local.properties
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }
        buildConfigField "String", "API_URL", "\"${localProperties.getProperty('API_URL', 'http://localhost:8080')}\""
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.fragment

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core-ktx:1.12.0'

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'

    // OpenVPN Module (Embedded)
    implementation project(':openvpn')

    // WireGuard Support (Native Library)
    implementation 'com.wireguard.android:tunnel:1.0.20230706'

    // IKEv2 Support
    // implementation files('libs/strongswan.aar') // TODO: Add local aar or use remote dependency

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
