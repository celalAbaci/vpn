# ===============================================================
# UYGULAMA AYARLARI
# ===============================================================
spring.application.name=superVPNProject
server.port=8080

# ===============================================================
# VERİTABANI AYARLARI (POSTGRESQL)
# ===============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/vpn_project_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:1}

# ===============================================================
# JPA & HIBERNATE AYARLARI
# ===============================================================
spring.jpa.properties.hibernate.default_schema=vpn_project
# 'create' her başlangıçta veritabanını sıfırlar. Geliştirme için 'update' daha güvenlidir.
spring.jpa.hibernate.ddl-auto=update
# <-- İŞARET: Bir önceki konuşmamıza istinaden SQL loglarını AÇMAK için bu satır 'true' olarak ayarlandı.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================================================
# JWT GÜVENLİK AYARLARI
# ===============================================================
# AŞAĞIDAKİ SECRET KEY'İ KESİNLİKLE DEĞİŞTİRİN!
# Güçlü bir key oluşturmak için https://www.allkeysgenerator.com/Random/Security-Key-Generator.aspx gibi siteleri kullanabilirsiniz.
# 256-bit (32 karakter) base64 formatında bir anahtar önerilir.
application.security.jwt.secret-key=LkZ371b7AP5W2cZUc6/DRaRTaqJF5ku3ogi2o0hGulQ=
# JWT geçerlilik süresi (milisaniye cinsinden). Örnek: 1 gün = 86400000
application.security.jwt.expiration=86400000
# Refresh Token geçerlilik süresi (gün cinsinden).
application.security.jwt.refresh-token.expiration-days=7

# ===============================================================
# HATA AYIKLAMA İÇİN LOGLAMA AYARLARI
#hata alınıp hata ekrana çıkmayınca kullan
# ===============================================================
#logging.level.org.springdoc=DEBUG
#logging.level.org.springframework.web=DEBUG
#server.error.include-stacktrace=always

# ===============================================================
# YENİ: GELİŞMİŞ İZLEME (ACTUATOR) AYARLARI
# ===============================================================
# Hangi endpoint'lerin web üzerinden erişilebilir olacağını belirler.
# 'health' (sağlık durumu), 'metrics' (metrikler), 'prometheus' (Prometheus formatında metrikler)
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Sağlık durumu detaylarını her zaman göster
management.endpoint.health.show-details=always

# Metriklerin Prometheus tarafından okunabilmesi için etiketleri (tags) etkinleştir
management.metrics.tags.application=${spring.application.name}

# ===============================================================
# JACKSON JSON SERIALIZATION
# ===============================================================
# Tarihlerin timestamp (sayısal dizi) yerine ISO-8601 String olarak gönderilmesini sağlar.
# Android tarafında Gson'un hata almaması için gereklidir.
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================================================




#===============================================================

#===============================================================
# GÜVENLİK: RATE LIMITING AYARLARI
#===============================================================
#Auth (Login/Register) endpoint'leri için IP başına dakika'da izin verilen istek sayısı
#Örn: 10 istek / 1 dakika
#Bu ayarlar RateLimitingInterceptor tarafından okunacaktır.
security.rate-limit.auth.capacity=10
security.rate-limit.auth.refill-rate=10
security.rate-limit.auth.refill-period-minutes=1

# ===============================================================
# YENİ EKLENDİ: GOOGLE PLAY BILLING AYARLARI
# ===============================================================
# Google Cloud Service Account JSON anahtar dosyanızın yolu.
# Bu dosyayı güvenli bir yere koyun (örn: /etc/secrets/google-service-account.json)
# veya test için projenizin ana dizinine koyup './google-service-account.json' olarak ayarlayın.
google.service-account.json-path=./google-service-account.json
# Android uygulamanızın paket adı
google.application.package-name=com.celalabaci.supervpn


# Geliştirme ortamında, .json dosyası olmadan çalışabilmek için 'false' yapın.
# Canlı ortamda (production) 'true' yapıp .json dosyasını ekleyin.
google.play.enabled=false

# ===============================================================




